<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AIRA - Wearable Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "primary-container": "#00ced1",
                        "surface-container-highest": "#35343a",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#5af8fb",
                        "tertiary-container": "#ffa282",
                        "on-tertiary-container": "#872a00",
                        "tertiary-fixed-dim": "#ffb59c",
                        "secondary-fixed-dim": "#fbbc00",
                        "on-secondary-fixed": "#261a00",
                        "inverse-primary": "#00696b",
                        "secondary": "#ffe2ab",
                        "on-primary-container": "#005354",
                        "on-surface-variant": "#bac9c9",
                        "on-secondary-container": "#6d5000",
                        "on-primary-fixed-variant": "#004f51",
                        "on-background": "#e4e1e9",
                        "surface-bright": "#39383e",
                        "surface": "#131318",
                        "primary": "#47eaed",
                        "on-primary": "#003738",
                        "surface-dim": "#131318",
                        "on-tertiary": "#5c1a00",
                        "on-secondary": "#402d00",
                        "on-primary-fixed": "#002020",
                        "surface-container-low": "#1b1b20",
                        "surface-container": "#1f1f25",
                        "on-tertiary-fixed-variant": "#822800",
                        "tertiary": "#ffc9b7",
                        "surface-container-high": "#2a292f",
                        "on-secondary-fixed-variant": "#5c4300",
                        "surface-tint": "#2ddbde",
                        "surface-variant": "#35343a",
                        "inverse-on-surface": "#303036",
                        "secondary-fixed": "#ffdfa0",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ffdbcf",
                        "on-tertiary-fixed": "#380c00",
                        "outline": "#859493",
                        "error-container": "#93000a",
                        "surface-container-lowest": "#0e0e13",
                        "outline-variant": "#3b4949",
                        "primary-fixed-dim": "#2ddbde",
                        "on-surface": "#e4e1e9",
                        "inverse-surface": "#e4e1e9",
                        "secondary-container": "#ffbf00",
                        "background": "#131318"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .ghost-border {
            border: 0.5px solid rgba(133, 148, 147, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen selection:bg-primary/30">
<!-- Suppressing Global Navigation for Transactional Onboarding Flow -->
<main class="relative px-6 pt-12 pb-24 max-w-2xl mx-auto">
<!-- Progress Indicator -->
<div class="flex items-center gap-2 mb-16">
<div class="h-1.5 flex-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary rounded-full"></div>
</div>
<span class="text-[10px] font-bold tracking-[0.15em] text-outline uppercase">Step 02/06</span>
</div>
<!-- Header Section -->
<header class="mb-12">
<h1 class="text-[3.5rem] font-extrabold leading-[1.1] tracking-[-0.04em] mb-4">
                Connect your <span class="text-primary">biometrics</span>.
            </h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md">Aira syncs with your digital health ecosystems to build your invisible health profile.</p>
</header>
<!-- Device Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-12"><!-- Device Card: Health Connect (Selected State) -->
<div class="relative bg-surface-container-low p-6 rounded-lg ghost-border ring-1 ring-primary/50">
<div class="flex justify-between items-start mb-8">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">sync_saved_locally</span>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-primary font-bold">check</span>
</div>
</div>
<h3 class="text-lg font-semibold tracking-tight">Health Connect</h3>
<p class="text-xs text-outline font-bold uppercase tracking-widest mt-1">Android Data Hub</p>
<div class="absolute inset-0 bg-primary/5 rounded-lg pointer-events-none"></div>
</div>
<!-- Device Card: Google Fit -->
<div class="group relative surface-container-low p-6 rounded-lg transition-all duration-300 hover:bg-surface-container ghost-border">
<div class="flex justify-between items-start mb-8">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl">fitness_center</span>
</div>
<div class="w-6 h-6 rounded-full border border-outline-variant group-hover:border-primary flex items-center justify-center transition-colors">
</div>
</div>
<h3 class="text-lg font-semibold tracking-tight">Google Fit</h3>
<p class="text-xs text-outline font-bold uppercase tracking-widest mt-1">Activity &amp; Vitality</p>
</div></div>
<!-- Secondary Option -->
<div class="flex justify-center mb-16">
<button class="text-sm font-semibold text-outline hover:text-primary transition-colors flex items-center gap-2 group">
                I don't have a wearable 
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Fixed Action Button (Onboarding Context) -->
<div class="fixed bottom-12 left-0 right-0 px-6 flex flex-col items-center gap-6">
<button class="w-full max-w-md bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold py-5 rounded-full shadow-2xl shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Continue to Sync
            </button>
<!-- Privacy Promise Badge -->
<div class="flex items-center gap-2 bg-surface-container-low/60 backdrop-blur-xl px-4 py-2 rounded-full border border-outline-variant/10">
<span class="material-symbols-outlined text-[18px] text-primary">verified_user</span>
<span class="text-[11px] font-bold tracking-wider text-on-surface-variant uppercase">Clinical Privacy Protocol Enabled</span>
</div>
</div>
</main>
<!-- Visual Polish: Decorative Gradient Bleed -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] -z-10 -translate-y-1/2 translate-x-1/2"></div>
<div class="fixed bottom-0 left-0 w-[300px] h-[300px] bg-primary/5 rounded-full blur-[100px] -z-10 translate-y-1/2 -translate-x-1/2"></div>
</body></html>
