[versions]
androidx-camera = "1.6.0"
mlkit-barcode = "17.3.0"
kotlin = "2.0.21"
agp = "8.13.2"
compose-bom = "2024.10.01"
hilt = "2.52"
room = "2.6.1"
work = "2.9.1"
supabase = "3.0.0"
coil = "2.7.0"
kotlinx-serialization = "1.7.3"
health-connect = "1.1.0"
play-services-fitness = "21.1.0"
play-services-auth = "21.2.0"
# generativeai removed due to Ktor 2 clash
tensorflow-lite = "2.17.0"
tensorflow-lite-support = "0.4.4"
revenuecat = "7.10.1"
firebase-bom = "33.6.0"
sqlcipher = "4.5.4"
androidx-sqlite = "2.4.0"
security-crypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"
navigation-compose = "2.8.4"
lifecycle = "2.8.7"
